<!DOCTYPE html>
<html lang="es" data-theme="Personal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Finanzas SM — Personal &amp; Atiexa</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0C5D94" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finanzas SM" />
<style>
  :root{
    --bg:#F1F3F6;
    --surface:#FFFFFF;
    --text:#1C2430;
    --text-muted:#64748B;
    --border:#E3E7ED;
    --success:#1E8E5A;
    --success-soft:#E5F4EC;
    --danger:#C1443A;
    --danger-soft:#FBEAE8;
    --radius:14px;
    --radius-sm:10px;
    --shadow: 0 1px 2px rgba(20,25,35,.04), 0 6px 20px rgba(20,25,35,.05);
  }
  html[data-theme="Personal"]{
    --accent:#A6642B;
    --accent-2:#7A4B22;
    --accent-soft:#F4E9DC;
  }
  html[data-theme="Atiexa"]{
    --accent:#0C5D94;
    --accent-2:#F09003;
    --accent-3:#92BB22;
    --accent-soft:#E3EEF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(48px + env(safe-area-inset-bottom));
  }
  .app{max-width:640px;margin:0 auto;padding:0 16px;}
  .header{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    padding:calc(18px + env(safe-area-inset-top)) 16px 10px;
    margin:0 -16px;
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;flex-direction:column;line-height:1.1;}
  .brand-title{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text);}
  .brand-sub{font-size:12px;color:var(--text-muted);font-weight:500;margin-top:2px;}
  .toggle{
    display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;
    box-shadow:var(--shadow);
  }
  .toggle button{
    border:none;background:transparent;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;
    color:var(--text-muted);cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .toggle button.active{background:var(--accent);color:#fff;}
  .tabnav{
    display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;
    scrollbar-width:none;
  }
  .tabnav::-webkit-scrollbar{display:none;}
  .tabnav button{
    flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .tabnav button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 12px;font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.01em;}
  .card h3 .muted{color:var(--text-muted);font-weight:600;}
  .field{margin-bottom:12px;min-width:0;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
  .field input,.field select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;color:var(--text);background:#fff;min-width:0;box-sizing:border-box;
    -webkit-appearance:none;appearance:none;
  }
  .field input[type="date"]{font-size:14px;}
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .btn{
    width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.secondary{background:var(--accent-soft);color:var(--accent);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;width:auto;}
  .notice{
    padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;margin-bottom:12px;
  }
  .notice.ok{background:var(--success-soft);color:var(--success);}
  .notice.err{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--text-muted);}
  .empty{color:var(--text-muted);font-size:13px;padding:8px 0;}
  .list-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-top:1px solid var(--border);
  }
  .list-row:first-of-type{border-top:none;}
  .list-row .desc{font-size:14px;font-weight:600;color:var(--text);}
  .list-row .meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .list-row .amount{font-size:14px;font-weight:800;white-space:nowrap;}
  .badge{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);margin-left:6px;
  }
  .badge.warn{background:#FDF0DC;color:#946200;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--accent-soft);border-radius:var(--radius-sm);padding:12px;}
  .stat .label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;}
  .stat .value{font-size:18px;font-weight:800;margin-top:4px;color:var(--text);}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;}
  .bar-track{background:var(--bg);border-radius:6px;height:8px;overflow:hidden;}
  .bar-fill{background:var(--accent);height:100%;border-radius:6px;}
  .spinner{
    width:18px;height:18px;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .center{display:flex;align-items:center;justify-content:center;padding:24px 0;}
  .footer-note{text-align:center;color:var(--text-muted);font-size:11px;padding:20px 0 0;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ==========================================================
// Reemplazá esta URL si volvés a implementar el backend y
// Google te da una URL nueva.
// ==========================================================
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2tECuAWA6QDKmO8iVJ0lL1Lxq3fCW4GPE-W0oCXX4o6mKGZlyYcE2HL9nFlZ5FkpQpw/exec";

let CURRENT_PIN = "";

async function callApi(action, payload = {}) {
  const url = APPS_SCRIPT_URL
    + "?action=" + encodeURIComponent(action)
    + "&payload=" + encodeURIComponent(JSON.stringify(payload))
    + "&pin=" + encodeURIComponent(CURRENT_PIN);
  const res = await fetch(url);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Error desconocido");
  return json.data;
}

function formatMoney(value, moneda) {
  const n = Number(value) || 0;
  const symbol = moneda === "USD" ? "US$" : "$";
  return symbol + " " + n.toLocaleString("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function formatDate(d) {
  if (!d) return "-";
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function toDateInputValue(val) {
  if (!val) return todayISO();
  const d = new Date(val);
  if (isNaN(d)) return todayISO();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
function nombreMesActual() { return MESES[new Date().getMonth()]; }

// Botón que pide confirmación en el lugar, sin usar alert()/confirm() del navegador
function ConfirmButton({ label, onConfirm, danger }) {
  const [confirming, setConfirming] = useState(false);
  if (confirming) {
    return (
      <span style={{ display: "inline-flex", gap: 6 }}>
        <button type="button" className="btn-sm" style={{ background: "var(--danger)", color: "#fff" }} onClick={() => { setConfirming(false); onConfirm(); }}>Confirmar</button>
        <button type="button" className="btn-sm secondary" onClick={() => setConfirming(false)}>Cancelar</button>
      </span>
    );
  }
  return (
    <button type="button" className="btn-sm secondary" style={danger ? { color: "var(--danger)" } : undefined} onClick={() => setConfirming(true)}>{label}</button>
  );
}

function useNotice() {
  const [notice, setNotice] = useState(null);
  const notify = useCallback((type, text) => {
    setNotice({ type, text });
    setTimeout(() => setNotice(null), 4000);
  }, []);
  return [notice, notify];
}

function Notice({ notice }) {
  if (!notice) return null;
  return <div className={"notice " + (notice.type === "ok" ? "ok" : "err")}>{notice.text}</div>;
}

// ---------------- ACCESO (PIN) ----------------
function LockScreen({ onUnlock }) {
  const [pin, setPin] = useState("");
  const [checking, setChecking] = useState(false);
  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();
    setError("");
    setChecking(true);
    CURRENT_PIN = pin;
    callApi("getTarjetas", {})
      .then(() => onUnlock())
      .catch((err) => { setError(err.message || "Error de conexión."); CURRENT_PIN = ""; })
      .finally(() => setChecking(false));
  }

  return (
    <div className="app" style={{ paddingTop: 70 }}>
      <div className="card" style={{ maxWidth: 300, margin: "0 auto" }}>
        <h3 style={{ textAlign: "center", fontSize: 18 }}>Finanzas SM</h3>
        <form onSubmit={submit}>
          <div className="field">
            <label>Código de acceso</label>
            <input type="password" autoFocus value={pin} onChange={(e) => setPin(e.target.value)} />
          </div>
          {error && <div className="notice err">{error}</div>}
          <button className="btn" disabled={checking || !pin}>{checking ? "Verificando..." : "Entrar"}</button>
        </form>
      </div>
    </div>
  );
}

// ---------------- HEADER ----------------
function Header({ ambito, setAmbito }) {
  return (
    <div className="header">
      <div className="header-row">
        <div className="brand">
          <span className="brand-title">Finanzas SM</span>
          <span className="brand-sub">Personal &amp; Atiexa</span>
        </div>
        <div className="toggle">
          <button className={ambito === "Personal" ? "active" : ""} onClick={() => setAmbito("Personal")}>Personal</button>
          <button className={ambito === "Atiexa" ? "active" : ""} onClick={() => setAmbito("Atiexa")}>Atiexa</button>
        </div>
      </div>
    </div>
  );
}

function TabNav({ tab, setTab }) {
  const tabs = [
    ["dashboard", "Dashboard"],
    ["cargar", "Cargar"],
    ["tarjetas", "Tarjetas / Cuotas"],
    ["deudas", "Deudas"],
    ["ahorros", "Ahorros"],
    ["fijos", "Gastos Fijos"],
  ];
  return (
    <div className="tabnav">
      {tabs.map(([key, label]) => (
        <button key={key} className={tab === key ? "active" : ""} onClick={() => setTab(key)}>{label}</button>
      ))}
    </div>
  );
}

// ---------------- DASHBOARD ----------------
const COLOR_PERSONAL = "#A6642B";
const COLOR_ATIEXA = "#0C5D94";
const PIE_COLORS = ["#0C5D94", "#F09003", "#92BB22", "#A6642B", "#C1443A", "#7A4B22", "#4B6B8A", "#8E6C88", "#B08D57", "#5B8C8C"];

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function donutSlicePath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const startOuter = polarToCartesian(cx, cy, rOuter, endAngle);
  const endOuter = polarToCartesian(cx, cy, rOuter, startAngle);
  const startInner = polarToCartesian(cx, cy, rInner, startAngle);
  const endInner = polarToCartesian(cx, cy, rInner, endAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return ["M", startOuter.x, startOuter.y, "A", rOuter, rOuter, 0, largeArc, 0, endOuter.x, endOuter.y,
    "L", startInner.x, startInner.y, "A", rInner, rInner, 0, largeArc, 1, endInner.x, endInner.y, "Z"].join(" ");
}

function PieChart({ data }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (!total) return null;
  let cumulative = 0;
  const size = 150, r = 66, rInner = 40, cx = size / 2, cy = size / 2;
  const slices = data.map((d, i) => {
    const startAngle = (cumulative / total) * 360;
    cumulative += d.value;
    const endAngle = (cumulative / total) * 360;
    return { path: donutSlicePath(cx, cy, r, rInner, startAngle, endAngle), color: PIE_COLORS[i % PIE_COLORS.length], ...d };
  });
  return (
    <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
      <svg width={size} height={size} viewBox={"0 0 " + size + " " + size} style={{ flexShrink: 0 }}>
        {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} />)}
      </svg>
      <div style={{ flex: 1, minWidth: 120 }}>
        {slices.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, marginBottom: 5 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block", flexShrink: 0 }}></span>
            <span style={{ flex: 1, color: "var(--text)" }}>{s.label}</span>
            <span style={{ fontWeight: 700 }}>{s.value.toLocaleString("es-AR")}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function AmbitoLabel({ label, color }) {
  return <div style={{ fontSize: 12, fontWeight: 800, color, textTransform: "uppercase", letterSpacing: ".03em", marginBottom: 8 }}>{label}</div>;
}

function Divider() { return <div style={{ height: 1, background: "var(--border)", margin: "16px 0" }}></div>; }

function ResumenBlock({ label, color, data }) {
  const monedas = data ? Object.keys(data.totalesPorMoneda || {}) : [];
  return (
    <div>
      <AmbitoLabel label={label} color={color} />
      {monedas.length === 0 && <div className="empty">Sin movimientos este mes.</div>}
      {monedas.map((m) => {
        const t = data.totalesPorMoneda[m];
        return (
          <div key={m} className="stat-grid" style={{ marginBottom: 8 }}>
            <div className="stat" style={{ background: color + "18" }}>
              <div className="label" style={{ color }}>Ingresos {m}</div>
              <div className="value">{formatMoney(t.ingresos, m)}</div>
            </div>
            <div className="stat" style={{ background: color + "18" }}>
              <div className="label" style={{ color }}>Gastos {m}</div>
              <div className="value">{formatMoney(t.gastos, m)}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CategoriasBlock({ label, color, data }) {
  const entries = data ? Object.entries(data.gastosPorCategoria || {}).sort((a, b) => b[1] - a[1]) : [];
  return (
    <div>
      <AmbitoLabel label={label} color={color} />
      {entries.length === 0 && <div className="empty">Sin gastos este mes.</div>}
      {entries.length > 0 && <PieChart data={entries.map(([k, v]) => ({ label: k, value: v }))} />}
    </div>
  );
}

function VencimientosBlock({ label, color, data }) {
  const venc = data ? data.proximosVencimientos || {} : {};
  const gruposTarjeta = agruparCuotasPorTarjeta(venc.cuotasTarjeta || []);
  const otros = [
    ...(venc.deudasInformales || []).map((d) => ({ desc: d["Acreedor"] + " (" + d["Nro Cuota"] + "/" + d["Cant. Cuotas"] + ")", fecha: d["Fecha Vencimiento"], monto: d["Monto Cuota"], tipo: "Deuda" })),
    ...(venc.gastosPendientes || []).map((g) => ({ desc: g["Categoría"] + (g["Nota"] ? " — " + g["Nota"] : ""), fecha: g["Fecha Vencimiento"] || g["Fecha"], monto: g["Monto"], tipo: "Gasto" })),
  ].sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

  const vacio = gruposTarjeta.length === 0 && otros.length === 0;

  return (
    <div>
      <AmbitoLabel label={label} color={color} />
      {vacio && <div className="empty">Sin vencimientos próximos. 🎉</div>}
      {gruposTarjeta.map((g, gi) => (
        <div key={"t" + gi} style={{ marginBottom: 10 }}>
          <div className="list-row">
            <div>
              <div className="desc">{g.tarjeta}<span className="badge warn">Tarjeta</span></div>
              <div className="meta">Vence {formatDate(g.fecha)}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              {g.totalARS > 0 && <div className="amount">{formatMoney(g.totalARS, "ARS")}</div>}
              {g.totalUSD > 0 && <div className="amount">{formatMoney(g.totalUSD, "USD")}</div>}
            </div>
          </div>
          <div style={{ paddingLeft: 10, borderLeft: "2px solid var(--border)" }}>
            {g.items.map((c, i) => {
              const esReintegro = c["Tipo"] === "Reintegro";
              return (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "4px 0", color: esReintegro ? "var(--success)" : "var(--text-muted)" }}>
                  <span>{c["Descripción"]}{esReintegro ? " (reintegro)" : " (" + c["Nro Cuota"] + "/" + c["Cant. Cuotas"] + ")"}</span>
                  <span>{esReintegro ? "-" : ""}{formatMoney(c["Monto Cuota"], c["Moneda"])}</span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      {otros.map((it, i) => (
        <div className="list-row" key={"o" + i}>
          <div>
            <div className="desc">{it.desc}<span className="badge warn">{it.tipo}</span></div>
            <div className="meta">Vence {formatDate(it.fecha)}</div>
          </div>
          <div className="amount">{formatMoney(it.monto)}</div>
        </div>
      ))}
    </div>
  );
}

function AhorrosBlock({ label, color, data }) {
  const ahorros = data ? data.ahorrosInversiones || [] : [];
  return (
    <div>
      <AmbitoLabel label={label} color={color} />
      {ahorros.length === 0 && <div className="empty">Sin ahorros cargados.</div>}
      {ahorros.map((a, i) => (
        <div className="list-row" key={i}>
          <div>
            <div className="desc">{a["Tipo"]}<span className="badge">{a["Moneda"]}</span></div>
            <div className="meta">
              Capital {formatMoney(a["Capital"], a["Moneda"])}
              {a["Tipo"] === "FCI" && <> · Rinde {formatMoney(a["Rendimiento Acumulado"], a["Moneda"])} ({a["Días Transcurridos"]} días)</>}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function GastosFijosBlock({ label, color, data }) {
  const fijos = data ? data.gastosFijosDelMes || [] : [];
  if (fijos.length === 0) return null;
  return (
    <div>
      <AmbitoLabel label={label} color={color} />
      {fijos.map((f, i) => (
        <div className="list-row" key={i}>
          <div>
            <div className="desc">
              {f.nombre}
              <span className="badge" style={f.cargado ? { background: "var(--success-soft)", color: "var(--success)" } : { background: "#FDF0DC", color: "#946200" }}>
                {f.cargado ? "Cargado" : "Pendiente"}
              </span>
            </div>
            <div className="meta">{f.categoria}{!f.cargado && f.montoEstimado ? " · aprox. " + formatMoney(f.montoEstimado, f.moneda) : ""}</div>
          </div>
          {f.cargado && <div className="amount">{formatMoney(f.montoCargado, f.moneda)}</div>}
        </div>
      ))}
    </div>
  );
}

function DashboardTab() {
  const [dPersonal, setDPersonal] = useState(null);
  const [dAtiexa, setDAtiexa] = useState(null);
  const [loading, setLoading] = useState(true);
  const [notice, notify] = useNotice();

  const load = useCallback(() => {
    setLoading(true);
    Promise.all([
      callApi("getDashboard", { ambito: "Personal" }),
      callApi("getDashboard", { ambito: "Atiexa" }),
    ])
      .then(([p, a]) => { setDPersonal(p); setDAtiexa(a); })
      .catch((e) => notify("err", e.message))
      .finally(() => setLoading(false));
  }, []);

  useEffect(() => { load(); }, [load]);

  if (loading) return <div className="center"><span className="spinner"></span></div>;
  if (!dPersonal || !dAtiexa) return null;

  return (
    <div>
      <Notice notice={notice} />

      <div className="card">

const BLANK_TX = { fecha: todayISO(), tipo: "Gasto", categoria: "", moneda: "ARS", medioPago: "", monto: "", estado: "Pagado", nota: "", fechaVencimiento: todayISO() };

function CargarTab({ ambito }) {
  const [form, setForm] = useState(BLANK_TX);
  const [editingId, setEditingId] = useState(null);
  const [categorias, setCategorias] = useState([]);
  const [medios, setMedios] = useState(["Efectivo", "Transferencia", "Débito"]);
  const [todasTx, setTodasTx] = useState([]);
  const [filtro, setFiltro] = useState("todos");
  const [saving, setSaving] = useState(false);
  const [notice, notify] = useNotice();

  const loadAux = useCallback(() => {
    callApi("getCategorias", { ambito }).then(setCategorias).catch(() => {});
    callApi("getTarjetas", {}).then((tj) => setMedios(["Efectivo", "Transferencia", "Débito", ...tj.map((t) => t["Nombre"])])).catch(() => {});
    callApi("getTransacciones", { ambito }).then((rows) => {
      setTodasTx([...rows].sort((a, b) => new Date(b["Fecha"]) - new Date(a["Fecha"])));
    }).catch(() => {});
  }, [ambito]);

  useEffect(() => { loadAux(); }, [loadAux]);
  useEffect(() => { setEditingId(null); setForm(BLANK_TX); }, [ambito]);

  const recientes = (filtro === "todos" ? todasTx : todasTx.filter((r) => r["Estado"] === (filtro === "pendientes" ? "Pendiente" : "Pagado")))
    .slice(0, filtro === "todos" ? 10 : 30);

  function update(field, value) { setForm((f) => ({ ...f, [field]: value })); }

  function startEdit(r) {
    setEditingId(r["ID"]);
    setForm({
      fecha: toDateInputValue(r["Fecha"]), tipo: r["Tipo"], categoria: r["Categoría"], moneda: r["Moneda"],
      medioPago: r["Medio de Pago"] || "", monto: String(r["Monto"]), estado: r["Estado"], nota: r["Nota"] || "",
      fechaVencimiento: toDateInputValue(r["Fecha Vencimiento"] || r["Fecha"]),
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function cancelEdit() { setEditingId(null); setForm(BLANK_TX); }

  function submit(e) {
    e.preventDefault();
    if (!form.categoria || !form.monto) { notify("err", "Completá al menos categoría y monto."); return; }
    setSaving(true);
    const action = editingId ? "updateTransaccion" : "addTransaccion";
    const payload = editingId ? { ...form, id: editingId, ambito, monto: Number(form.monto) } : { ...form, ambito, monto: Number(form.monto) };
    callApi(action, payload)
      .then(() => {
        notify("ok", editingId ? "Movimiento actualizado." : "Movimiento cargado.");
        setEditingId(null);
        setForm(BLANK_TX);
        loadAux();
      })
      .catch((e) => notify("err", e.message))
      .finally(() => setSaving(false));
  }

  function eliminar(r) {
    callApi("deleteTransaccion", { id: r["ID"] })
      .then(() => { notify("ok", "Movimiento eliminado."); if (editingId === r["ID"]) cancelEdit(); loadAux(); })
      .catch((e) => notify("err", e.message));
  }

  function marcarPagado(r) {
    callApi("updateEstadoTransaccion", { id: r["ID"], estado: "Pagado" })
      .then(() => { notify("ok", "Movimiento marcado como pagado."); loadAux(); })
      .catch((e) => notify("err", e.message));
  }

  const [renombre, setRenombre] = useState({ actual: "", nueva: "" });
  const [renombrando, setRenombrando] = useState(false);

  function submitRenombrar(e) {
    e.preventDefault();
    if (!renombre.actual || !renombre.nueva) { notify("err", "Elegí la categoría actual y escribí el nuevo nombre."); return; }
    setRenombrando(true);
    callApi("renombrarCategoria", { ambito, categoriaOriginal: renombre.actual, categoriaNueva: renombre.nueva })
      .then((res) => { notify("ok", "Categoría renombrada (" + res.renombrados + " movimientos actualizados)."); setRenombre({ actual: "", nueva: "" }); loadAux(); })
      .catch((e) => notify("err", e.message))
      .finally(() => setRenombrando(false));
  }

  return (
    <div>
      <Notice notice={notice} />
      <form className="card" onSubmit={submit}>
        <h3>{editingId ? "Editar movimiento" : "Cargar movimiento"} <span className="muted">· {ambito}</span></h3>
        <div className="row2">
          <div className="field">
            <label>Fecha</label>
            <input type="date" value={form.fecha} onChange={(e) => update("fecha", e.target.value)} />
          </div>
          <div className="field">
            <label>Tipo</label>
            <select value={form.tipo} onChange={(e) => update("tipo", e.target.value)}>
              <option>Gasto</option>
              <option>Ingreso</option>
            </select>
          </div>
        </div>
        <div className="field">
          <label>Categoría</label>
          <input list="cat-list" value={form.categoria} onChange={(e) => update("categoria", e.target.value)} placeholder="Ej: Comida, Software..." />
          <datalist id="cat-list">{categorias.map((c) => <option key={c} value={c} />)}</datalist>
        </div>
        {form.tipo === "Gasto" && (
          <div className="field">
            <label>Fecha de vencimiento</label>
            <input type="date" value={form.fechaVencimiento} onChange={(e) => update("fechaVencimiento", e.target.value)} />
          </div>
        )}
        <div className="row2">
          <div className="field">
            <label>Moneda</label>
            <select value={form.moneda} onChange={(e) => update("moneda", e.target.value)}>
              <option>ARS</option>
              <option>USD</option>
            </select>
          </div>
          <div className="field">
            <label>Monto</label>
            <input type="number" step="0.01" value={form.monto} onChange={(e) => update("monto", e.target.value)} placeholder="0.00" />
          </div>
        </div>
        <div className="field">
          <label>Medio de pago</label>
          <input list="medio-list" value={form.medioPago} onChange={(e) => update("medioPago", e.target.value)} placeholder="Efectivo, tarjeta..." />
          <datalist id="medio-list">{medios.map((m) => <option key={m} value={m} />)}</datalist>
        </div>
        <div className="field">
          <label>Estado</label>
          <select value={form.estado} onChange={(e) => update("estado", e.target.value)}>
            <option>Pagado</option>
            <option>Pendiente</option>
          </select>
        </div>
        <div className="field">
          <label>Nota (opcional)</label>
          <input value={form.nota} onChange={(e) => update("nota", e.target.value)} placeholder="Detalle..." />
        </div>
        {editingId ? (
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn" disabled={saving}>{saving ? "Guardando..." : "Guardar cambios"}</button>
            <button type="button" className="btn secondary" onClick={cancelEdit}>Cancelar</button>
          </div>
        ) : (
          <button className="btn" disabled={saving}>{saving ? "Guardando..." : "Guardar movimiento"}</button>
        )}
      </form>

      <div className="card">
        <h3>Últimos movimientos</h3>
        <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
          {[["todos", "Todos"], ["pendientes", "Pendientes"], ["pagados", "Pagados"]].map(([key, label]) => (
            <button
              key={key}
              type="button"
              className="btn-sm"
              style={filtro === key
                ? { background: "var(--accent)", color: "#fff" }
                : { background: "var(--bg)", color: "var(--text-muted)" }}
              onClick={() => setFiltro(key)}
            >{label}</button>
          ))}
        </div>
        {recientes.length === 0 && <div className="empty">No hay movimientos para este filtro.</div>}
        {recientes.map((r, i) => (
          <div className="list-row" key={i}>
            <div>
              <div className="desc">{r["Categoría"]}<span className="badge">{r["Tipo"]}</span></div>
              <div className="meta">
                {formatDate(r["Fecha"])} · {r["Medio de Pago"]}
                {r["Estado"] === "Pendiente" && <span className="badge warn">Pendiente</span>}
                {r["Tipo"] === "Gasto" && r["Estado"] === "Pendiente" && r["Fecha Vencimiento"] && <> · vence {formatDate(r["Fecha Vencimiento"])}</>}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div className="amount" style={{ color: r["Tipo"] === "Ingreso" ? "var(--success)" : "var(--text)" }}>
                {r["Tipo"] === "Ingreso" ? "+" : "-"}{formatMoney(r["Monto"], r["Moneda"])}
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 4, justifyContent: "flex-end", flexWrap: "wrap" }}>
                {r["Estado"] === "Pendiente" && <button type="button" className="btn-sm secondary" onClick={() => marcarPagado(r)}>Marcar pagado</button>}
                <button type="button" className="btn-sm secondary" onClick={() => startEdit(r)}>Editar</button>
                <ConfirmButton label="Eliminar" danger onConfirm={() => eliminar(r)} />
              </div>
            </div>
          </div>
        ))}
      </div>

      {categorias.length > 0 && (
        <form className="card" onSubmit={submitRenombrar}>
          <h3>Renombrar categoría <span className="muted">· {ambito}</span></h3>
          <div className="field">
            <label>Categoría actual</label>
            <select value={renombre.actual} onChange={(e) => setRenombre({ ...renombre, actual: e.target.value })}>
              <option value="">Elegir...</option>
              {categorias.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Nuevo nombre</label>
            <input value={renombre.nueva} onChange={(e) => setRenombre({ ...renombre, nueva: e.target.value })} placeholder="Ej: Alimentación" />
          </div>
          <button className="btn secondary" disabled={renombrando}>{renombrando ? "Renombrando..." : "Renombrar en todo lo cargado"}</button>
        </form>
      )}
    </div>
  );
}

function agruparCuotasPorTarjeta(cuotas) {
  const grupos = {};
  cuotas.forEach((c) => {
    const key = c["Tarjeta"] + "|" + c["Fecha Vencimiento"];
    if (!grupos[key]) grupos[key] = { tarjeta: c["Tarjeta"], fecha: c["Fecha Vencimiento"], totalARS: 0, totalUSD: 0, items: [] };
    const moneda = c["Moneda"] || "ARS";
    const signo = c["Tipo"] === "Reintegro" ? -1 : 1;
    const monto = (Number(c["Monto Cuota"]) || 0) * signo;
    if (moneda === "USD") grupos[key].totalUSD += monto;
    else grupos[key].totalARS += monto;
    grupos[key].items.push(c);
  });
  return Object.values(grupos).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
}

    callApi("getTarjetas", {}).then(setTarjetas).catch(() => {});

      setCuotas([...rows].sort((a, b) => new Date(a["Fecha Vencimiento"]) - new Date(b["Fecha Vencimiento"])));
    }).catch(() => {});

        <div className="field"><label>Descripción</label><input value={rForm.descripcion} onChange={(e) => setRForm({ ...rForm, descripcion: e.target.value })} placeholder="Ej: Devolución de ganancias" /></div>
        <div className="row2">
          <div className="field"><label>Importe (en positivo)</label><input type="number" step="0.01" value={rForm.monto} onChange={(e) => setRForm({ ...rForm, monto: e.target.value })} /></div>
          <div className="field"><label>Moneda</label>
            <select value={rForm.moneda} onChange={(e) => setRForm({ ...rForm, moneda: e.target.value })}>
              <option>ARS</option><option>USD</option>
            </select>
          </div>
        </div>
        <div className="field"><label>Fecha</label><input type="date" value={rForm.fecha} onChange={(e) => setRForm({ ...rForm, fecha: e.target.value })} /></div>
        <button className="btn secondary" disabled={savingR}>{savingR ? "Guardando..." : "Cargar reintegro"}</button>
      </form>

      <div className="card">
        <h3>Cuotas pendientes <span className="muted">· {ambito}</span></h3>
        {grupos.length === 0 && <div className="empty">No tenés cuotas pendientes.</div>}
        {grupos.map((g, gi) => (
          <div key={gi} style={{ marginBottom: 16, paddingBottom: 12, borderBottom: gi < grupos.length - 1 ? "1px solid var(--border)" : "none" }}>
            <div className="list-row" style={{ borderTop: "none", padding: "0 0 6px" }}>
              <div>
                <div className="desc">{g.tarjeta}</div>
                <div className="meta">Vence {formatDate(g.fecha)}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                {g.totalARS > 0 && <div className="amount">{formatMoney(g.totalARS, "ARS")}</div>}
                {g.totalUSD > 0 && <div className="amount">{formatMoney(g.totalUSD, "USD")}</div>}
              </div>
            </div>
            <div style={{ paddingLeft: 10, borderLeft: "2px solid var(--border)", marginTop: 6 }}>
              {g.items.map((c, i) => {
                const esReintegro = c["Tipo"] === "Reintegro";
                return (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "6px 0", gap: 8 }}>
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 600 }}>
                        {c["Descripción"]}
                        {esReintegro ? <span className="badge" style={{ background: "var(--success-soft)", color: "var(--success)" }}>Reintegro</span> : <span className="badge">{c["Nro Cuota"]}/{c["Cant. Cuotas"]}</span>}
                      </div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: esReintegro ? "var(--success)" : "var(--text)" }}>
                        {esReintegro ? "-" : ""}{formatMoney(c["Monto Cuota"], c["Moneda"])}
                      </div>
                      <div style={{ display: "flex", gap: 5, marginTop: 4, justifyContent: "flex-end", flexWrap: "wrap" }}>
                        {!esReintegro && <button className="btn-sm secondary" onClick={() => marcarPagada(c)}>Pagada</button>}
                        {!esReintegro && <button type="button" className="btn-sm secondary" onClick={() => startEditCompra(c)}>Editar</button>}
                        <ConfirmButton label="Eliminar" danger onConfirm={() => eliminarCompra(c)} />
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------------- DEUDAS INFORMALES ----------------
function DeudasTab({ ambito }) {
  const [deudas, setDeudas] = useState([]);
  const [notice, notify] = useNotice();
  const [form, setForm] = useState({ acreedor: "", importeTotal: "", cantCuotas: "1", frecuencia: "Mensual", fechaPrimeraCuota: todayISO() });
  const [saving, setSaving] = useState(false);

  const load = useCallback(() => {
    callApi("getDeudasInformales", { ambito, estado: "Pendiente" }).then((rows) => {
      setDeudas([...rows].sort((a, b) => new Date(a["Fecha Vencimiento"]) - new Date(b["Fecha Vencimiento"])));
    }).catch(() => {});
  }, [ambito]);

  useEffect(() => { load(); }, [load]);

  function submit(e) {
    e.preventDefault();
    if (!form.acreedor || !form.importeTotal || !form.cantCuotas) { notify("err", "Completá acreedor, importe y cuotas."); return; }
    setSaving(true);
    callApi("addDeudaInformal", { ...form, ambito, importeTotal: Number(form.importeTotal), cantCuotas: Number(form.cantCuotas) })
      .then(() => { notify("ok", "Deuda cargada."); setForm({ acreedor: "", importeTotal: "", cantCuotas: "1", frecuencia: "Mensual", fechaPrimeraCuota: todayISO() }); load(); })
      .catch((e) => notify("err", e.message))
      .finally(() => setSaving(false));
  }

  function marcarPagada(d) {
    callApi("updateEstadoDeuda", { idDeuda: d["ID Deuda"], nroCuota: d["Nro Cuota"], estado: "Pagado" })
      .then(() => { notify("ok", "Cuota marcada como pagada."); load(); })
      .catch((e) => notify("err", e.message));
  }

  function eliminarDeuda(d) {
    callApi("deleteDeudaInformal", { idDeuda: d["ID Deuda"] })
      .then(() => { notify("ok", "Deuda eliminada (todas sus cuotas)."); load(); })
      .catch((e) => notify("err", e.message));
  }

  return (
    <div>
      <Notice notice={notice} />
      <form className="card" onSubmit={submit}>
        <h3>Deuda informal <span className="muted">· {ambito}</span></h3>
        <div className="field"><label>Acreedor</label><input value={form.acreedor} onChange={(e) => setForm({ ...form, acreedor: e.target.value })} placeholder="¿A quién le debés?" /></div>
        <div className="row2">
          <div className="field"><label>Importe total</label><input type="number" step="0.01" value={form.importeTotal} onChange={(e) => setForm({ ...form, importeTotal: e.target.value })} /></div>
          <div className="field"><label>Cant. cuotas</label><input type="number" min="1" value={form.cantCuotas} onChange={(e) => setForm({ ...form, cantCuotas: e.target.value })} /></div>
        </div>
        <div className="row2">
          <div className="field">
            <label>Frecuencia</label>
            <select value={form.frecuencia} onChange={(e) => setForm({ ...form, frecuencia: e.target.value })}>
              <option>Mensual</option><option>Quincenal</option><option>Semanal</option>
            </select>
          </div>
          <div className="field"><label>Primera cuota</label><input type="date" value={form.fechaPrimeraCuota} onChange={(e) => setForm({ ...form, fechaPrimeraCuota: e.target.value })} /></div>
        </div>
        <button className="btn" disabled={saving}>{saving ? "Guardando..." : "Cargar deuda"}</button>
      </form>

      <div className="card">
        <h3>Pendientes <span className="muted">· {ambito}</span></h3>
        {deudas.length === 0 && <div className="empty">No tenés deudas informales pendientes.</div>}
        {deudas.map((d, i) => (
          <div className="list-row" key={i}>
            <div>
              <div className="desc">{d["Acreedor"]} <span className="badge">{d["Nro Cuota"]}/{d["Cant. Cuotas"]}</span></div>
              <div className="meta">vence {formatDate(d["Fecha Vencimiento"])}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div className="amount">{formatMoney(d["Monto Cuota"])}</div>
              <div style={{ display: "flex", gap: 6, marginTop: 4, justifyContent: "flex-end" }}>
                <button className="btn-sm secondary" onClick={() => marcarPagada(d)}>Marcar pagada</button>
                <ConfirmButton label="Eliminar" danger onConfirm={() => eliminarDeuda(d)} />
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------------- AHORROS E INVERSIONES ----------------
function AhorrosTab({ ambito }) {
  const [ahorros, setAhorros] = useState([]);
  const [notice, notify] = useNotice();
  const [form, setForm] = useState({ tipo: "Efectivo", capital: "", moneda: "ARS", fechaCarga: todayISO(), tasaTNA: "" });
  const [saving, setSaving] = useState(false);

  const load = useCallback(() => {
    callApi("getAhorrosInversiones", { ambito }).then(setAhorros).catch(() => {});
  }, [ambito]);

  function eliminar(a) {
    callApi("deleteAhorroInversion", { id: a["ID"] })
      .then(() => { notify("ok", "Registro eliminado."); load(); })
      .catch((e) => notify("err", e.message));
  }

  useEffect(() => { load(); }, [load]);

  function submit(e) {
    e.preventDefault();
    if (!form.capital) { notify("err", "Completá el capital."); return; }
    if (form.tipo === "FCI" && !form.tasaTNA) { notify("err", "Completá la tasa TNA del fondo."); return; }
    setSaving(true);
    callApi("addAhorroInversion", { ...form, ambito, capital: Number(form.capital), tasaTNA: Number(form.tasaTNA || 0) })
      .then(() => { notify("ok", "Ahorro/inversión cargado."); setForm({ tipo: "Efectivo", capital: "", moneda: "ARS", fechaCarga: todayISO(), tasaTNA: "" }); load(); })
      .catch((e) => notify("err", e.message))
      .finally(() => setSaving(false));
  }

  return (
    <div>
      <Notice notice={notice} />
      <form className="card" onSubmit={submit}>
        <h3>Nuevo ahorro / inversión <span className="muted">· {ambito}</span></h3>
        <div className="row2">
          <div className="field">
            <label>Tipo</label>
            <select value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })}>
              <option>Efectivo</option><option>FCI</option>
            </select>
          </div>
          <div className="field">
            <label>Moneda</label>
            <select value={form.moneda} onChange={(e) => setForm({ ...form, moneda: e.target.value })}>
              <option>ARS</option><option>USD</option>
            </select>
          </div>
        </div>
        <div className="row2">
          <div className="field"><label>Capital</label><input type="number" step="0.01" value={form.capital} onChange={(e) => setForm({ ...form, capital: e.target.value })} /></div>
          <div className="field"><label>Fecha de carga</label><input type="date" value={form.fechaCarga} onChange={(e) => setForm({ ...form, fechaCarga: e.target.value })} /></div>
        </div>
        {form.tipo === "FCI" && (
          <div className="field"><label>Tasa TNA (%)</label><input type="number" step="0.01" value={form.tasaTNA} onChange={(e) => setForm({ ...form, tasaTNA: e.target.value })} placeholder="Ej: 38" /></div>
        )}
        <button className="btn" disabled={saving}>{saving ? "Guardando..." : "Guardar"}</button>
      </form>

      <div className="card">
        <h3>Tus ahorros e inversiones <span className="muted">· {ambito}</span></h3>
        {ahorros.length === 0 && <div className="empty">Todavía no cargaste nada acá.</div>}
        {ahorros.map((a, i) => (
          <div className="list-row" key={i}>
            <div>
              <div className="desc">{a["Tipo"]}<span className="badge">{a["Moneda"]}</span></div>
              <div className="meta">
                Cargado {formatDate(a["Fecha de Carga"])}
                {a["Tipo"] === "FCI" && <> · TNA {a["Tasa TNA (%)"]}% · {a["Días Transcurridos"]} días</>}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div className="amount">{formatMoney(a["Capital"], a["Moneda"])}</div>
              {a["Tipo"] === "FCI" && <div className="meta" style={{ color: "var(--success)", fontWeight: 700 }}>+{formatMoney(a["Rendimiento Acumulado"], a["Moneda"])}</div>}
              <div style={{ marginTop: 4 }}><ConfirmButton label="Eliminar" danger onConfirm={() => eliminar(a)} /></div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------------- GASTOS FIJOS ----------------
function GastosFijosTab({ ambito }) {
  const [fijos, setFijos] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [notice, notify] = useNotice();
  const [form, setForm] = useState({ nombre: "", categoria: "", montoEstimado: "", moneda: "ARS" });
  const [saving, setSaving] = useState(false);

  const load = useCallback(() => {
    callApi("getGastosFijos", { ambito }).then(setFijos).catch(() => {});
    callApi("getCategorias", { ambito }).then(setCategorias).catch(() => {});
  }, [ambito]);

  useEffect(() => { load(); }, [load]);

  function submit(e) {
    e.preventDefault();
    if (!form.nombre || !form.categoria) { notify("err", "Completá nombre y categoría."); return; }
    setSaving(true);
    callApi("addGastoFijo", { ...form, ambito, montoEstimado: form.montoEstimado ? Number(form.montoEstimado) : "" })
      .then(() => { notify("ok", "Gasto fijo agregado."); setForm({ nombre: "", categoria: "", montoEstimado: "", moneda: "ARS" }); load(); })
      .catch((e) => notify("err", e.message))
      .finally(() => setSaving(false));
  }

  function eliminar(f) {
    callApi("deleteGastoFijo", { id: f["ID"] })
      .then(() => { notify("ok", "Gasto fijo eliminado."); load(); })
      .catch((e) => notify("err", e.message));
  }

  return (
    <div>
      <Notice notice={notice} />
      <form className="card" onSubmit={submit}>
        <h3>Nuevo gasto fijo <span className="muted">· {ambito}</span></h3>
        <div className="field"><label>Nombre</label><input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Ej: Alquiler, Luz, Internet..." /></div>
        <div className="field">
          <label>Categoría</label>
          <input list="cat-list-fijos" value={form.categoria} onChange={(e) => setForm({ ...form, categoria: e.target.value })} placeholder="Tiene que coincidir con la categoría que usás al cargar" />
          <datalist id="cat-list-fijos">{categorias.map((c) => <option key={c} value={c} />)}</datalist>
        </div>
        <div className="row2">
          <div className="field"><label>Monto estimado (opcional)</label><input type="number" step="0.01" value={form.montoEstimado} onChange={(e) => setForm({ ...form, montoEstimado: e.target.value })} placeholder="Si varía, dejalo vacío" /></div>
          <div className="field">
            <label>Moneda</label>
            <select value={form.moneda} onChange={(e) => setForm({ ...form, moneda: e.target.value })}>
              <option>ARS</option><option>USD</option>
            </select>
          </div>
        </div>
        <button className="btn" disabled={saving}>{saving ? "Guardando..." : "Agregar gasto fijo"}</button>
      </form>

      <div className="card">
        <h3>Tus gastos fijos <span className="muted">· {ambito}</span></h3>
        {fijos.length === 0 && <div className="empty">Todavía no cargaste gastos fijos.</div>}
        {fijos.map((f, i) => (
          <div className="list-row" key={i}>
            <div>
              <div className="desc">{f["Nombre"]}</div>
              <div className="meta">{f["Categoría"]} {f["Monto Estimado"] && <>· aprox. {formatMoney(f["Monto Estimado"], f["Moneda"])}</>}</div>
            </div>
            <ConfirmButton label="Eliminar" danger onConfirm={() => eliminar(f)} />
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------------- APP ----------------
function App() {
  const [ambito, setAmbito] = useState("Personal");
  const [tab, setTab] = useState("dashboard");

  useEffect(() => { document.documentElement.dataset.theme = ambito; }, [ambito]);

  return (
    <div className="app">
      <Header ambito={ambito} setAmbito={setAmbito} />
      <TabNav tab={tab} setTab={setTab} />
      <main>
        {tab === "dashboard" && <DashboardTab />}
        {tab === "cargar" && <CargarTab ambito={ambito} />}
        {tab === "tarjetas" && <TarjetasTab ambito={ambito} />}
        {tab === "deudas" && <DeudasTab ambito={ambito} />}
        {tab === "ahorros" && <AhorrosTab ambito={ambito} />}
        {tab === "fijos" && <GastosFijosTab ambito={ambito} />}
      </main>
      <div className="footer-note">Conectado a tu Google Sheet · Finanzas_Seba</div>
    </div>
  );
}

function Root() {
  const [unlocked, setUnlocked] = useState(false);
  if (!unlocked) return <LockScreen onUnlock={() => setUnlocked(true)} />;
  return <App />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
